<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>8thhorseman</title>

<link rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23000'/%3E%3C/svg%3E">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #fff;
    color: #111;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;

    user-select: none;
    -webkit-user-select: none;
}

button,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.screen {
    display: none;

    width: 100%;
    min-height: 100vh;

    padding: 24px;
}

.screen.active {
    display: flex;
    flex-direction: column;
}

.center {
    justify-content: center;
    align-items: center;
    text-align: center;
}


/* ==================================================
   LOGO
================================================== */

.home-logo,
.top-logo {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.45px;
}

.home-logo {
    position: absolute;
    top: 24px;
    left: 24px;
}


/* ==================================================
   HOME
================================================== */

.home-content {
    width: 100%;
    max-width: 520px;
}

.home-title {
    margin: 0;

    font-size: clamp(48px, 13vw, 82px);
    line-height: .88;

    letter-spacing: -5px;
    font-weight: 700;
}

.home-subtitle {
    margin: 22px 0 0;

    color: #777;
    font-size: 15px;
}

.primary-button {
    min-height: 50px;

    margin-top: 38px;
    padding: 15px 28px;

    border: 0;
    border-radius: 999px;

    background: #111;
    color: #fff;

    font-size: 15px;
    font-weight: 600;

    touch-action: manipulation;
}

.primary-button:active {
    transform: scale(.97);
}


/* ==================================================
   GENERAL
================================================== */

.heading {
    margin: 0;

    font-size: clamp(34px, 8vw, 54px);
    line-height: .95;

    letter-spacing: -3px;
    font-weight: 700;
}

.description {
    max-width: 430px;

    margin: 15px auto 0;

    color: #777;

    font-size: 14px;
    line-height: 1.5;
}

.small-button {
    min-height: 46px;

    padding: 13px 21px;

    border: 0;
    border-radius: 999px;

    background: #111;
    color: #fff;

    font-size: 14px;
    font-weight: 600;

    touch-action: manipulation;
}

.secondary-button {
    min-height: 46px;

    padding: 13px 21px;

    border: 1px solid #ddd;
    border-radius: 999px;

    background: #fff;
    color: #111;

    font-size: 14px;
    font-weight: 600;

    touch-action: manipulation;
}

.button-row {
    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 28px;
}


/* ==================================================
   NUMBER
================================================== */

.number-grid {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    max-width: 400px;

    margin: 34px auto 0;
}

.number-button {
    width: 56px;
    height: 56px;

    border: 1px solid #ddd;

    border-radius: 50%;

    background: #fff;
    color: #111;

    font-size: 17px;
    font-weight: 600;

    touch-action: manipulation;
}

.number-button:active {
    background: #111;
    color: #fff;
}


/* ==================================================
   SETUP
================================================== */

.setup-list {
    width: 100%;
    max-width: 500px;

    margin: 30px auto 0;
}

.setup-row {
    display: grid;

    grid-template-columns:
        115px
        1fr;

    align-items: center;

    gap: 15px;

    padding: 12px 0;

    border-bottom: 1px solid #eee;
}

.setup-number {
    color: #999;

    font-size: 13px;

    text-align: left;
}

.name-select {
    width: 100%;

    min-height: 45px;

    padding: 0 13px;

    border: 1px solid #ddd;

    border-radius: 10px;

    background: #fff;
    color: #111;

    outline: none;
}


/* ==================================================
   PLAYING CARD
================================================== */

/*
   Slightly taller than before.
*/

.card {
    position: relative;

    width: 82px;
    height: 124px;

    flex-shrink: 0;

    overflow: hidden;

    border: 1px solid #d0d0d0;

    border-radius: 9px;

    background: #fff;

    box-shadow:
        0 2px 7px rgba(0,0,0,.12);

    color: #111;

    /*
       Important for mobile dragging.
    */
    touch-action: none;

    -webkit-user-drag: none;
}

.card.red {
    color: #c51e1e;
}

.card.black {
    color: #111;
}

.card-rank {
    position: absolute;

    top: 8px;
    left: 9px;

    font-size: 15px;
    font-weight: 700;

    line-height: 1;
}

.card-suit {
    position: absolute;

    top: 25px;
    left: 9px;

    font-size: 13px;

    line-height: 1;
}

.card-center {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 34px;

    line-height: 1;
}

.card-rank-bottom {
    position: absolute;

    right: 9px;
    bottom: 8px;

    font-size: 15px;
    font-weight: 700;

    line-height: 1;

    transform:
        rotate(180deg);
}

.card-suit-bottom {
    position: absolute;

    right: 9px;
    bottom: 25px;

    font-size: 13px;

    line-height: 1;

    transform:
        rotate(180deg);
}


/* ==================================================
   CARD TOUCH / DRAG
================================================== */

.card.dragging {
    z-index: 999;

    box-shadow:
        0 15px 30px rgba(0,0,0,.22);

    transition: none;
}


/* ==================================================
   CHOICE AREA
================================================== */

.choice-area {

    position: relative;

    width:
        min(96vw, 570px);

    height: 330px;

    margin: 28px auto 0;

    /*
       Cards are allowed to be touched
       individually.
    */
    touch-action: none;
}


/*
   Cards now overlap much more.
   They look like one joined pile.
*/

.choice-card {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 82px;
    height: 124px;

    margin-left: -41px;
    margin-top: -62px;

    transition:
        transform .3s
        cubic-bezier(.2,.8,.2,1);

    touch-action: none;

    cursor: grab;
}

.choice-card:active {
    cursor: grabbing;
}


/*
   Only tiny horizontal separation.
*/

.choice-card:nth-child(1) {
    transform:
        translateX(-31px)
        rotate(-2.5deg);

    z-index: 1;
}

.choice-card:nth-child(2) {
    transform:
        translateX(-24px)
        rotate(-2deg);

    z-index: 2;
}

.choice-card:nth-child(3) {
    transform:
        translateX(-17px)
        rotate(-1.5deg);

    z-index: 3;
}

.choice-card:nth-child(4) {
    transform:
        translateX(-9px)
        rotate(-.7deg);

    z-index: 4;
}

.choice-card:nth-child(5) {
    transform:
        translateX(-1px)
        rotate(.5deg);

    z-index: 5;
}

.choice-card:nth-child(6) {
    transform:
        translateX(7px)
        rotate(1deg);

    z-index: 6;
}

.choice-card:nth-child(7) {
    transform:
        translateX(15px)
        rotate(1.5deg);

    z-index: 7;
}

.choice-card:nth-child(8) {
    transform:
        translateX(23px)
        rotate(2.5deg);

    z-index: 8;
}


/*
   Selected card comes forward.
*/

.choice-card.selected {
    z-index: 500;

    transform:
        translate(-50%, -50%)
        translateY(-48px)
        scale(1.08) !important;

    cursor: default;
}

.choice-card.selected .card {
    box-shadow:
        0 14px 30px rgba(0,0,0,.23);
}


/* ==================================================
   HIDE
================================================== */

.hide-area {
    margin-top: 10px;
}

.hide-message {
    font-size: 19px;
    font-weight: 600;
}


/* ==================================================
   PERFORMANCE
================================================== */

.performance-screen {
    position: relative;

    overflow: hidden;

    background: #000;
    color: #fff;
}

.performance-screen .top-logo {
    color: #fff;
}

.performance-content {
    position: relative;

    z-index: 5;

    width: 100%;

    text-align: center;
}

.performance-title {
    margin: 0;

    font-size:
        clamp(30px, 8vw, 47px);

    line-height: 1;

    letter-spacing: -2.5px;
}

.deck-area {

    position: relative;

    width: 290px;
    height: 230px;

    margin: 30px auto 0;

    touch-action: none;
}


/*
   Performer deck also uses larger cards.
*/

.deck-card {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 82px;
    height: 124px;

    margin-left: -41px;
    margin-top: -62px;

    touch-action: none;

    cursor: grab;
}


/*
   Extremely compact deck.
*/

.deck-card:nth-child(1) {
    transform:
        translateX(-17px)
        rotate(-3.5deg);
}

.deck-card:nth-child(2) {
    transform:
        translateX(-14px)
        rotate(-3deg);
}

.deck-card:nth-child(3) {
    transform:
        translateX(-11px)
        rotate(-2.5deg);
}

.deck-card:nth-child(4) {
    transform:
        translateX(-8px)
        rotate(-2deg);
}

.deck-card:nth-child(5) {
    transform:
        translateX(-4px)
        rotate(-1deg);
}

.deck-card:nth-child(6) {
    transform:
        translateX(0)
        rotate(0deg);
}

.deck-card:nth-child(7) {
    transform:
        translateX(4px)
        rotate(1deg);
}

.deck-card:nth-child(8) {
    transform:
        translateX(8px)
        rotate(2deg);
}

.deck-card:nth-child(9) {
    transform:
        translateX(11px)
        rotate(2.5deg);
}

.deck-card:nth-child(10) {
    transform:
        translateX(14px)
        rotate(3deg);
}

.shuffle-button {
    position: relative;

    z-index: 20;

    min-height: 46px;

    padding: 13px 23px;

    border: 1px solid #333;

    border-radius: 999px;

    background: #111;
    color: #fff;

    font-size: 14px;
    font-weight: 600;

    touch-action: manipulation;
}


/*
   Background tap zone.
*/

.black-click-zone {

    position: fixed;

    inset: 0;

    z-index: 1;

    cursor: pointer;
}

.black-click-zone.disabled {
    pointer-events: none;
}


/* ==================================================
   WRONG CARD
================================================== */

.wrong-screen {

    position: relative;

    overflow: hidden;

    background: #000;

    color: #fff;
}

.wrong-content {

    position: relative;

    z-index: 5;

    width: 100%;

    max-width: 500px;

    margin: auto;

    text-align: center;
}

.wrong-card-wrap {

    display: flex;

    justify-content: center;

    align-items: center;

    margin: 0;
}

.wrong-card-wrap .card {
    pointer-events: none;

    box-shadow:
        0 15px 30px rgba(255,255,255,.08);
}


/* ==================================================
   FINAL
================================================== */

.final-screen {

    background: #000;

    color: #fff;
}

.final-content {

    width: 100%;

    max-width: 500px;

    margin: auto;

    text-align: center;
}

.final-small {

    margin-bottom: 13px;

    color: #666;

    font-size: 13px;
}

.final-title {

    margin: 0;

    font-size:
        clamp(42px, 12vw, 70px);

    line-height: .95;

    letter-spacing: -4px;

    font-weight: 700;
}

.final-playing-card {

    display: flex;

    justify-content: center;

    margin-top: 30px;
}

.name-card {

    display: flex;

    align-items: center;

    justify-content: center;

    width:
        min(82vw, 280px);

    min-height: 108px;

    margin: 32px auto 0;

    padding: 20px;

    border-radius: 15px;

    color: #fff;

    font-size: 25px;

    font-weight: 700;

    letter-spacing: -1px;

    background: #18263d;

    transition:
        background .7s ease;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    .screen {
        padding: 20px;
    }

    .home-logo {
        top: 20px;
        left: 20px;
    }

    /*
       Large enough for fingers,
       but still compact.
    */

    .card {
        width: 76px;
        height: 116px;
    }

    .choice-card {

        width: 76px;
        height: 116px;

        margin-left: -38px;
        margin-top: -58px;
    }

    .choice-area {

        width: 100%;

        height: 315px;

        margin-top: 22px;
    }

    .choice-card:nth-child(1) {
        transform:
            translateX(-28px)
            rotate(-2.5deg);
    }

    .choice-card:nth-child(2) {
        transform:
            translateX(-22px)
            rotate(-2deg);
    }

    .choice-card:nth-child(3) {
        transform:
            translateX(-16px)
            rotate(-1.5deg);
    }

    .choice-card:nth-child(4) {
        transform:
            translateX(-9px)
            rotate(-.7deg);
    }

    .choice-card:nth-child(5) {
        transform:
            translateX(-1px)
            rotate(.5deg);
    }

    .choice-card:nth-child(6) {
        transform:
            translateX(7px)
            rotate(1deg);
    }

    .choice-card:nth-child(7) {
        transform:
            translateX(14px)
            rotate(1.5deg);
    }

    .choice-card:nth-child(8) {
        transform:
            translateX(21px)
            rotate(2.5deg);
    }

    .card-center {
        font-size: 31px;
    }

    .deck-area {

        width: 280px;

        height: 220px;
    }

    .deck-card {

        width: 76px;
        height: 116px;

        margin-left: -38px;
        margin-top: -58px;
    }

    .setup-row {

        grid-template-columns:
            100px
            1fr;
    }

}


/* ==================================================
   VERY SMALL PHONES
================================================== */

@media (max-width: 360px) {

    .card {

        width: 70px;
        height: 108px;
    }

    .choice-card {

        width: 70px;
        height: 108px;

        margin-left: -35px;
        margin-top: -54px;
    }

    .choice-card:nth-child(1) {
        transform:
            translateX(-24px)
            rotate(-2deg);
    }

    .choice-card:nth-child(2) {
        transform:
            translateX(-19px)
            rotate(-1.7deg);
    }

    .choice-card:nth-child(3) {
        transform:
            translateX(-14px)
            rotate(-1.3deg);
    }

    .choice-card:nth-child(4) {
        transform:
            translateX(-8px)
            rotate(-.6deg);
    }

    .choice-card:nth-child(5) {
        transform:
            translateX(-1px);
    }

    .choice-card:nth-child(6) {
        transform:
            translateX(6px)
            rotate(1deg);
    }

    .choice-card:nth-child(7) {
        transform:
            translateX(12px)
            rotate(1.5deg);
    }

    .choice-card:nth-child(8) {
        transform:
            translateX(18px)
            rotate(2deg);
    }

    .card-center {
        font-size: 28px;
    }

    .card-rank,
    .card-rank-bottom {
        font-size: 13px;
    }

    .card-suit,
    .card-suit-bottom {
        font-size: 11px;
    }

}

</style>
</head>


<body>

<div id="app">


<!-- ==================================================
     HOME
================================================== -->

<section id="homeScreen"
         class="screen active center">

    <div id="secretLogo"
         class="home-logo">
        8thhorseman
    </div>

    <div class="home-content">

        <h1 class="home-title">
            8thhorseman
        </h1>

        <p class="home-subtitle">
            A card trick with a secret.
        </p>

        <button id="startButton"
                class="primary-button">
            Start
        </button>

    </div>

</section>



<!-- ==================================================
     COUNT
================================================== -->

<section id="countScreen"
         class="screen center">

    <div class="top-logo">
        8thhorseman
    </div>

    <h2 class="heading">
        How many?
    </h2>

    <p class="description">
        Choose the number of contestants.
    </p>

    <div id="numberGrid"
         class="number-grid">
    </div>

</section>



<!-- ==================================================
     SECRET SETUP
================================================== -->

<section id="setupScreen"
         class="screen center">

    <div class="top-logo">
        8thhorseman
    </div>

    <h2 class="heading">
        Setup
    </h2>

    <p class="description">
        Choose the secret name for each contestant.
    </p>

    <div id="setupList"
         class="setup-list">
    </div>

    <button id="setupDoneButton"
            class="primary-button">
        Begin
    </button>

</section>



<!-- ==================================================
     CHOOSE
================================================== -->

<section id="chooseScreen"
         class="screen center">

    <div class="top-logo">
        8thhorseman
    </div>

    <h2 class="heading">
        Contestant
        <span id="contestantNumber"></span>
    </h2>

    <p class="description">
        Choose one card.
    </p>

    <div id="choiceArea"
         class="choice-area">
    </div>

    <div id="hideArea"
         class="hide-area"
         style="display:none;">

        <div class="hide-message">
            Remember it.
        </div>

        <button id="hideButton"
                class="primary-button">
            Hide
        </button>

    </div>

</section>



<!-- ==================================================
     PERFORMANCE
================================================== -->

<section id="performanceScreen"
         class="screen performance-screen center">

    <div class="top-logo">
        8thhorseman
    </div>

    <div class="performance-content">

        <h2 class="performance-title">
            Watch.
        </h2>

        <div id="deckArea"
             class="deck-area">
        </div>

        <button id="shuffleButton"
                class="shuffle-button">
            Shuffle
        </button>

    </div>

    <div id="blackClickZone"
         class="black-click-zone">
    </div>

</section>



<!-- ==================================================
     WRONG
================================================== -->

<section id="wrongScreen"
         class="screen wrong-screen center">

    <div class="wrong-content">

        <div id="wrongCardWrap"
             class="wrong-card-wrap">
        </div>

    </div>

</section>



<!-- ==================================================
     FINAL
================================================== -->

<section id="finalScreen"
         class="screen final-screen center">

    <div class="final-content">

        <div class="final-small">
            Your card
        </div>

        <h2 id="finalCardText"
            class="final-title">
            —
        </h2>

        <div id="finalPlayingCard"
             class="final-playing-card">
        </div>

        <div id="nameCard"
             class="name-card">

            <span id="finalNameText">
                —
            </span>

        </div>

        <div class="button-row">

            <button id="nextButton"
                    class="small-button">
                Next
            </button>

            <button id="restartButton"
                    class="secondary-button">
                Restart
            </button>

        </div>

    </div>

</section>

</div>

/* ==================================================
   SHUFFLE
================================================== */

function shuffle(array) {

    const result =
        [...array];

    for (
        let i =
            result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;
}

/* ==================================================
   TOUCHABLE / MOVABLE CARDS
================================================== */

function addCardTouchControl(
    wrapper,
    card
) {

    let startX = 0;
    let startY = 0;

    let originalX = 0;
    let originalY = 0;

    let dragging = false;

    let moved = false;


    wrapper.addEventListener(
        "pointerdown",
        event => {

            if (
                state.selectedCard
            ) {
                return;
            }


            event.preventDefault();

            wrapper.setPointerCapture(
                event.pointerId
            );


            startX =
                event.clientX;

            startY =
                event.clientY;


            originalX = 0;
            originalY = 0;


            dragging = true;
            moved = false;


            wrapper
                .classList
                .add(
                    "dragging"
                );


            /*
               Bring the touched card
               to the front.
            */

            wrapper.style.zIndex =
                "200";

        },
        {
            passive: false
        }
    );


    wrapper.addEventListener(
        "pointermove",
        event => {

            if (!dragging) {
                return;
            }


            event.preventDefault();


            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;


            if (
                Math.abs(dx) > 4 ||
                Math.abs(dy) > 4
            ) {

                moved = true;

            }


            wrapper.style.transform =
                `
                translate(
                    calc(-50% + ${dx}px),
                    calc(-50% + ${dy}px)
                )
                rotate(0deg)
                scale(1.05)
                `;

        },
        {
            passive: false
        }
    );


    wrapper.addEventListener(
        "pointerup",
        event => {

            if (!dragging) {
                return;
            }


            dragging = false;


            wrapper
                .classList
                .remove(
                    "dragging"
                );


            try {

                wrapper.releasePointerCapture(
                    event.pointerId
                );

            } catch (_) {}


            /*
               If the user actually moved
               the card, don't select it.

               This makes the cards genuinely
               movable without accidental selection.
            */

            if (moved) {

                setTimeout(() => {

                    wrapper.style.transform =
                        "";

                }, 80);

                return;

            }


            /*
               A simple tap selects.
            */

            chooseCard(
                card,
                wrapper
            );

        },
        {
            passive: false
        }
    );


    wrapper.addEventListener(
        "pointercancel",
        () => {

            dragging = false;

            wrapper
                .classList
                .remove(
                    "dragging"
                );

            wrapper.style.transform =
                "";

        }
    );

}

/* ==================================================
   PHONE MOTION
================================================== */

async function prepareMotion() {

    if (
        typeof DeviceMotionEvent ===
        "undefined"
    ) {

        return;

    }


    /*
       iOS permission.
    */

    if (
        typeof DeviceMotionEvent.requestPermission ===
        "function"
    ) {

        createMotionPermissionLayer();

        return;

    }


    /*
       Android and supported browsers.
    */

    startMotionListener();

}


/* ==================================================
   IOS PERMISSION
================================================== */

function createMotionPermissionLayer() {

    if (
        document.getElementById(
            "motionPermissionLayer"
        )
    ) {

        return;

    }


    const layer =
        document.createElement(
            "div"
        );


    layer.id =
        "motionPermissionLayer";


    layer.style.position =
        "fixed";

    layer.style.inset =
        "0";

    layer.style.zIndex =
        "999";

    layer.style.background =
        "transparent";

    layer.style.touchAction =
        "manipulation";


    /*
       The user touches anywhere.

       No visible instruction.
    */

    layer.addEventListener(
        "pointerdown",
        async event => {

            event.preventDefault();


            try {

                const permission =
                    await DeviceMotionEvent
                        .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    startMotionListener();

                }

            } catch (error) {

                console.log(
                    error
                );

            }


            layer.remove();

        },
        {
            once: true,
            passive: false
        }
    );


    document.body.appendChild(
        layer
    );

}

   MOTION LISTENER
================================================== */

    if (
        state.motionListening

/* ==================================================
   SHAKE DETECTION
================================================== */

function detectShake(event) {

    if (
        !state.motionReady
    ) {
        return;
    }


    if (
        state.revealed
    ) {
        return;
    }


    if (
        !state.wrongCard
    ) {
        return;
    }


    if (
        !screens.wrong.classList.contains(
            "active"
        )
    ) {

        return;

    }


    const acceleration =
        event.acceleration ||
        event.accelerationIncludingGravity;


    if (!acceleration) {
        return;
    }


    const x =
        acceleration.x || 0;

    const y =
        acceleration.y || 0;

    const z =
        acceleration.z || 0;


    if (
        !state.lastMotion
    ) {

        state.lastMotion = {
            x,
            y,
            z
        };

        return;

    }


    const dx =
        x -
        state.lastMotion.x;

    const dy =
        y -
        state.lastMotion.y;

    const dz =
        z -
        state.lastMotion.z;


    state.lastMotion = {
        x,
        y,
        z
    };


    const movement =
        Math.sqrt(
            dx * dx +
            dy * dy +
            dz * dz
        );


    if (
        movement > 2.5
    ) {

        state.shakeEnergy +=
            movement;

    } else {

        state.shakeEnergy *=
            .82;

    }


    const now =
        performance.now();


    if (
        state.shakeEnergy > 27 &&
        now - state.lastShake > 1200
    ) {

        state.shakeEnergy =
            0;

        state.lastShake =
            now;


        if (
            "vibrate" in navigator
        ) {

            navigator.vibrate(
                70
            );

        }


        revealReal();

    }

}


/* ==================================================
   FINAL REVEAL
================================================== */

function revealReal() {

    if (
        state.revealed
    ) {

        return;

    }


    if (
        !state.selectedCard
    ) {

        return;

    }


    state.revealed =
        true;

    state.motionReady =
        false;

    state.lastMotion =
        null;

    state.shakeEnergy =
        0;


    const permissionLayer =
        document.getElementById(
            "motionPermissionLayer"
        );


    if (
        permissionLayer
    ) {

        permissionLayer.remove();

    }


    const card =
        state.selectedCard;


    /*
       Retrieve the private name
       stored in the card.
    */

    const realName =
        card.privateContestantName ||
        state.names[
            state.currentContestant - 1
        ];


    finalCardText.textContent =
        card.rank +
        " " +
        card.suit;


    finalPlayingCard.innerHTML =
        cardHTML(card);


    finalNameText.textContent =
        realName;


    nameCard.style.background =
        "#18263d";


    showScreen(
        screens.final
    );


    startNameColorCycle();

}

);


secretLogo.addEventListener(
    "pointerleave",
    () => {

        clearTimeout(
            logoTimer
        );

    }
);


/* ==================================================
   CONTEXT MENU
================================================== */

document.addEventListener(
    "contextmenu",
    event => {

        if (
            event.target.closest(
                ".card"
            ) ||
            event.target.closest(
                ".choice-card"
            ) ||
            event.target.closest(
                ".deck-card"
            )
        ) {

            event.preventDefault();

        }

    }
);


/* ==================================================
   INITIALIZE
================================================== */

createNumberButtons();

</script>
